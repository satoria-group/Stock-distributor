# Stack development.
#
# Source code (termasuk .env, vendor/, dan public/build) masuk lewat bind mount
# dari host, jadi image development sengaja tidak mem-bake apa pun. Jalankan
# `composer install` dan `npm run build` di host seperti biasa — atau biarkan
# entrypoint memasang vendor/ kalau belum ada.
#
# Database TIDAK disediakan di sini; aplikasi memakai PostgreSQL eksternal
# sesuai DB_HOST di .env.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: stock_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
    volumes:
      - .:/var/www/html
      # node_modules dibiarkan jadi volume anonim supaya isi host (Windows)
      # tidak menimpa binary native hasil install di container.
      - /var/www/html/node_modules
    networks:
      - stock_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: nginx:alpine
    container_name: stock_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - stock_network
    healthcheck:
      # /up membangunkan Laravel sepenuhnya. Di stack dev, source code datang
      # dari bind mount Windows sehingga setiap file autoload melewati batas
      # virtiofs — satu request bisa 0,3-4 detik, dan melonjak lebih lama lagi
      # saat mesin sibuk. Timeout dibuat longgar supaya container tidak
      # ditandai unhealthy padahal aplikasinya sehat.
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s

networks:
  stock_network:
    driver: bridge
