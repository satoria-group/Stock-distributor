# Stack development.
#
# Source code (termasuk .env, vendor/, dan public/build) masuk lewat bind mount
# dari host, jadi image development sengaja tidak mem-bake apa pun. Jalankan
# `composer install` dan `npm run build` di host seperti biasa — atau biarkan
# entrypoint memasang vendor/ kalau belum ada.
#
# Database TIDAK disediakan di sini; aplikasi memakai PostgreSQL eksternal
# sesuai DB_HOST di .env.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: stock_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
    volumes:
      - .:/var/www/html
      # Volume anonim ini diinisialisasi dari node_modules yang sudah dipasang
      # di stage `development` image, sehingga isi host (binari Windows) tidak
      # menimpanya. Setelah mengubah package.json, jalankan dengan
      # `--renew-anon-volumes` agar volume lama tidak dipakai ulang.
      - /var/www/html/node_modules
    networks:
      - stock_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 2>/dev/null || nc -w 1 127.0.0.1 9000 </dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: nginx:alpine
    container_name: stock_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - stock_network
    healthcheck:
      # /up membangunkan Laravel sepenuhnya. Di stack dev, source code datang
      # dari bind mount Windows sehingga setiap file autoload melewati batas
      # virtiofs — satu request bisa 0,3-4 detik, dan melonjak lebih lama lagi
      # saat mesin sibuk. Timeout dibuat longgar supaya container tidak
      # ditandai unhealthy padahal aplikasinya sehat.
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: stock_scheduler_dev
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - stock_network

networks:
  stock_network:
    driver: bridge
